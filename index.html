<style>
  :root{

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,sans-serif;line-height:1.6;padding-bottom:80px}

  /* hero */

  .hero .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin-bottom:10px}
  .hero h1{font-size:clamp(26px,5.5vw,40px);font-weight:900;line-height:1.3}
  .hero .dday{display:inline-block;margin-top:16px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 22px;font-size:18px;font-weight:600}

  .info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;text-align:center}
  .info-card .k{font-size:12px;color:var(--sub)}
  .info-card .v{font-size:15px;font-weight:600;margin-top:2px}

  section>h2{font-size:21px;font-weight:900;margin-bottom:4px}
  section>.desc{font-size:13px;color:var(--sub);margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

  .tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}

  .tl-time{flex:0 0 92px;font-weight:600;font-size:14px;color:var(--accent);padding-top:2px}
  .tl-body .t{font-weight:600;font-size:15px}
  .tl-body .d{font-size:13px;color:var(--sub)}

  .tl-main{border-left:3px solid var(--accent);padding-left:11px;margin-left:-14px}

  .ct-row .k{color:var(--sub);flex:0 0 44px}

  .chip.s0{background:var(--amber-soft);color:var(--amber)}
  .chip.s1{background:var(--accent-soft);color:var(--accent)}
  .chip.s2{background:var(--green-soft);color:var(--green)}

  .chk .due{flex:0 0 78px;font-size:12px;font-weight:600;color:var(--accent);margin-top:4px}

  .bep.warn{background:var(--amber-soft);color:var(--amber)}

/* ====== 상태 & 저장 ====== */
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let db = null;

function persist(){
  if (db) db.ref(DB_PATH).set(state);
  else { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); render(); }
}

/* 깊은 병합: 저장된 데이터에 없는 새 필드는 기본값으로 채움 */
function mergeState(saved){
  if (!saved) return JSON.parse(JSON.stringify(DEFAULT_STATE));
  const out = JSON.parse(JSON.stringify(DEFAULT_STATE));
  for (const k of Object.keys(saved)){
    out[k] = saved[k];
  }
  return out;
}

function getPath(path){ return path.reduce((o,k)=>o[k], state); }
function setPath(path, val){
  const parent = path.slice(0,-1).reduce((o,k)=>o[k], state);
  parent[path[path.length-1]] = val;
}

/* ====== 헬퍼 ====== */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function won(n){ return n.toLocaleString('ko-KR') + '원'; }

function editable(elm, path, opts={}){
  elm.classList.add('ed');
  elm.title = '클릭해서 수정';
  elm.addEventListener('click', ()=>{
    if (elm.querySelector('input')) return;
    const cur = getPath(path);
    const inp = document.createElement('input');
    inp.value = cur;
    if (opts.number) inp.type = 'text';
    elm.textContent = '';
    elm.appendChild(inp);
    inp.focus(); inp.select();
    let committed = false;
    const commit = ()=>{
      if (committed) return; committed = true;
      let v = inp.value.trim();
      if (opts.number){ v = parseInt(v.replace(/[^0-9]/g,''),10); if (isNaN(v)) v = cur; }
      setPath(path, v);
      persist(); render();
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e=>{
      if (e.key==='Enter'){ e.preventDefault(); inp.blur(); }
      if (e.key==='Escape'){ committed = true; render(); }
    });
  });
}

  app.appendChild(renderHero());
  app.appendChild(renderTimeline());
  app.appendChild(renderContents());
  app.appendChild(renderRoadmap());
  app.appendChild(renderBudget());
  app.appendChild(renderRoles());
  app.appendChild(renderFlea());
  app.appendChild(renderRecruit());
  app.appendChild(renderDecisions());
}

function renderHero(){
  const m = state.meta;
  const sec = el('div','hero');
  sec.appendChild(el('div','eyebrow', m.eyebrow));
  const h1 = el('h1','', m.title);
  editable(h1, ['meta','title']);
  sec.appendChild(h1);
  const sub = el('p','desc', m.subtitle);
  sub.style.marginTop='8px';
  editable(sub, ['meta','subtitle']);
  sec.appendChild(sub);

  const days = Math.ceil((new Date(m.date+'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  const ddayText = days > 0 ? `D-${days}` : (days === 0 ? 'D-DAY 🎉' : '종료');
  sec.appendChild(el('div','dday', ddayText));

  const cards = el('div','info-cards');
  const infos = [
    ['일시', m.dateLabel + ' ' + m.time, null],
    ['장소', m.venue, ['meta','venue']],
    ['참가비', m.fee, ['meta','fee']],
    ['규모', m.capacity, ['meta','capacity']]
  ];
  for (const [k,v,path] of infos){
    const c = el('div','info-card');
    c.appendChild(el('div','k',k));
    const vv = el('div','v',v);
    if (path) editable(vv, path);
    c.appendChild(vv);
    cards.appendChild(c);
  }
  sec.appendChild(cards);
  return sec;
}

function renderTimeline(){
  const sec = el('section');
  sec.appendChild(el('h2','', '① 당일 타임라인'));
  sec.appendChild(el('div','desc','색 막대가 있는 항목이 본행사 큐시트 · 밀리면 패널토크 축소가 1순위 조정안'));
  const card = el('div','card');
  state.timeline.forEach((t,i)=>{
    const row = el('div','tl-item' + (t.main?' tl-main':''));
    row.appendChild(el('div','tl-time', t.time));
    const body = el('div','tl-body');
    const title = el('div','t', t.title);
    title.appendChild(el('span','tl-len', t.len));
    body.appendChild(title);
    const d = el('div','d', t.desc);
    editable(d, ['timeline', i, 'desc']);
    body.appendChild(d);
    row.appendChild(body);
    card.appendChild(row);
  });
  sec.appendChild(card);
  return sec;
}

const STATUS = ['준비중','진행중','확정'];
function renderContents(){
  const sec = el('section');
  sec.appendChild(el('h2','', '② 콘텐츠'));
  sec.appendChild(el('div','desc','상태 칩을 누르면 준비중 → 진행중 → 확정 순으로 바뀜'));
  const grid = el('div','grid');
  state.contents.forEach((c,i)=>{
    const card = el('div','ct-card');
    const chip = el('span','chip s'+c.status, STATUS[c.status]);
    chip.addEventListener('click', ()=>{
      state.contents[i].status = (c.status+1)%3;
      persist(); render();
    });
    card.appendChild(chip);
    card.appendChild(el('h3','',c.name));
    const r1 = el('div','ct-row');
    r1.appendChild(el('span','k','담당'));
    const owner = el('span','', c.owner);
    editable(owner, ['contents', i, 'owner']);
    r1.appendChild(owner);
    card.appendChild(r1);
    const r2 = el('div','ct-row');
    r2.appendChild(el('span','k','준비'));
    const prep = el('span','', c.prep);
    editable(prep, ['contents', i, 'prep']);
    r2.appendChild(prep);
    card.appendChild(r2);
    grid.appendChild(card);
  });
  sec.appendChild(grid);
  return sec;
}

function checkRow(item, path, withDue){
  const row = el('div','chk' + (item.done?' done':''));
  const box = el('div','box', item.done?'✓':'');
  row.appendChild(box);
  if (withDue) row.appendChild(el('div','due', item.due));
  row.appendChild(el('div','txt', item.task || item.text));
  row.addEventListener('click', ()=>{
    setPath([...path,'done'], !item.done);
    persist(); render();
  });
  return row;
}

function renderRoadmap(){
  const sec = el('section');
  sec.appendChild(el('h2','', '③ 준비 로드맵 (D-50 → D-DAY)'));
  sec.appendChild(el('div','desc','끝낸 항목은 클릭해서 체크'));
  const card = el('div','card');
  state.roadmap.forEach((r,i)=> card.appendChild(checkRow(r, ['roadmap',i], true)));
  sec.appendChild(card);

  const h3 = el('div','desc','📍 답사 체크리스트 (6/20 전 카페 방문 시)');
  h3.style.margin='18px 0 10px'; h3.style.fontWeight='600'; h3.style.color='var(--ink)';
  sec.appendChild(h3);
  const card2 = el('div','card');
  state.visitChecklist.forEach((r,i)=> card2.appendChild(checkRow(r, ['visitChecklist',i], false)));
  sec.appendChild(card2);
  return sec;
}

function renderBudget(){
  const sec = el('section');
  sec.appendChild(el('h2','', '④ 예산'));
  sec.appendChild(el('div','desc','금액을 클릭하면 수정 가능 · 손익은 지출 합계 기준 자동 계산'));
  const card = el('div','card');

  const t1 = el('table');
  const thead = el('thead');
  const hr = el('tr');
  ['지출 항목','금액','비고'].forEach((h,idx)=>{
    const th = el('th','',h);
    if (idx===1) th.className='num';
    hr.appendChild(th);
  });
  thead.appendChild(hr); t1.appendChild(thead);
  const tb = el('tbody');
  let total = 0;
  state.budget.expenses.forEach((e,i)=>{
    total += e.amount;
    const tr = el('tr');
    tr.appendChild(el('td','',e.item));
    const amt = el('td','num', won(e.amount));
    editable(amt, ['budget','expenses',i,'amount'], {number:true});
    tr.appendChild(amt);
    const note = el('td','', e.note);
    note.style.color='var(--sub)'; note.style.fontSize='13px';
    editable(note, ['budget','expenses',i,'note']);
    tr.appendChild(note);
    tb.appendChild(tr);
  });
  const trT = el('tr','total');
  trT.appendChild(el('td','','지출 합계'));
  trT.appendChild(el('td','num', won(total)));
  trT.appendChild(el('td'));
  tb.appendChild(trT);
  t1.appendChild(tb);
  card.appendChild(t1);

  const gap = el('div'); gap.style.height='22px'; card.appendChild(gap);

  const t2 = el('table');
  const thead2 = el('thead');
  const hr2 = el('tr');
  ['수입 시나리오','구성','수입','손익'].forEach((h,idx)=>{
    const th = el('th','',h);
    if (idx>=2) th.className='num';
    hr2.appendChild(th);
  });
  thead2.appendChild(hr2); t2.appendChild(thead2);
  const tb2 = el('tbody');
  state.budget.scenarios.forEach((s,i)=>{
    const tr = el('tr');
    tr.appendChild(el('td','',s.name));
    const calc = el('td','', s.calc);
    editable(calc, ['budget','scenarios',i,'calc']);
    tr.appendChild(calc);
    const inc = el('td','num', won(s.income));
    editable(inc, ['budget','scenarios',i,'income'], {number:true});
    tr.appendChild(inc);
    const diff = s.income - total;
    const tdD = el('td','num');
    const badge = el('span','bep ' + (diff>=0?'ok':'warn'), (diff>=0?'+':'') + won(diff).replace('원','') );
    tdD.appendChild(badge);
    tr.appendChild(tdD);
    tb2.appendChild(tr);
  });
  t2.appendChild(tb2);
  card.appendChild(t2);
  card.appendChild(el('div','hint','손익분기: 참가비 25,000원 기준 약 ' + Math.ceil(total/25000) + '명'));
  sec.appendChild(card);
  return sec;
}

function renderRoles(){
  const sec = el('section');
  sec.appendChild(el('h2','', '⑤ 역할 분담'));
  sec.appendChild(el('div','desc','담당자 이름을 클릭해서 채워넣기'));
  const card = el('div','card');
  const t = el('table');
  const thead = el('thead');
  const hr = el('tr');
  ['역할','담당','비고'].forEach(h=> hr.appendChild(el('th','',h)));
  thead.appendChild(hr); t.appendChild(thead);
  const tb = el('tbody');
  state.roles.forEach((r,i)=>{
    const tr = el('tr');
    tr.appendChild(el('td','',r.role));
    const p = el('td','',r.person);
    p.style.fontWeight='600';
    if (r.person.includes('미정')) p.style.color='var(--amber)';
    editable(p, ['roles',i,'person']);
    tr.appendChild(p);
    const n = el('td','',r.note);
    n.style.color='var(--sub)'; n.style.fontSize='13px';
    tr.appendChild(n);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  card.appendChild(t);
  sec.appendChild(card);
  return sec;
}

function renderFlea(){
  const sec = el('section');
  sec.appendChild(el('h2','', '⑥ 책 플리마켓 운영 규칙'));
  sec.appendChild(el('div','desc',''));
  const card = el('div','card');
  const ul = el('ul','plain');
  state.flea.forEach((f,i)=>{
    const li = el('li');
    const span = el('span','',f);
    editable(span, ['flea',i]);
    li.appendChild(span);
    ul.appendChild(li);
  });
  card.appendChild(ul);
  sec.appendChild(card);
  return sec;
}

function renderRecruit(){
  const r = state.recruit;
  const sec = el('section');
  sec.appendChild(el('h2','', '⑦ 모집 현황'));
  sec.appendChild(el('div','desc','신청(입금 확정) 인원을 +/− 로 갱신'));
  const card = el('div','card');

  const bar = el('div','bar');
  const fill = el('div','fill');
  fill.style.width = Math.min(100, (r.current/r.max)*100) + '%';
  bar.appendChild(fill);
  const mark = el('div','bep-mark');
  mark.style.left = (r.breakeven/r.max)*100 + '%';
  mark.title = '손익분기 ' + r.breakeven + '명';
  bar.appendChild(mark);
  card.appendChild(bar);

  const nums = el('div','recruit-nums');
  nums.appendChild(el('span','', '현재 ' + r.current + '명'));
  const right = el('span');
  [['손익분기 ','breakeven'], [' · 목표 ','goal'], [' · 최대 ','max']].forEach(([label,key])=>{
    right.appendChild(document.createTextNode(label));
    const n = el('span','', String(r[key]));
    editable(n, ['recruit', key], {number:true});
    right.appendChild(n);
    right.appendChild(document.createTextNode('명'));
  });
  nums.appendChild(right);
  card.appendChild(nums);

  const st = el('div','stepper');
  const minus = el('button','','−');
  minus.addEventListener('click', ()=>{ if (r.current>0){ r.current--; persist(); render(); } });
  const cur = el('div','cur', String(r.current));
  const plus = el('button','','+');
  plus.addEventListener('click', ()=>{ r.current++; persist(); render(); });
  st.appendChild(minus); st.appendChild(cur); st.appendChild(plus);
  st.appendChild(el('span','desc','명 신청 완료'));
  card.appendChild(st);
  sec.appendChild(card);
  return sec;
}

function renderDecisions(){
  const sec = el('section');
  sec.appendChild(el('h2','', '⑧ 결정 로그 & 미결 사항'));
  sec.appendChild(el('div','desc','🔶 = 아직 결정 안 됨 · 결정되면 칩을 눌러 확정으로 전환'));
  const card = el('div','card');
  state.decisions.forEach((d,i)=>{
    const row = el('div','dec');
    row.appendChild(el('div','date', d.date));
    const chip = el('span','chip ' + (d.open?'s0':'s2'), d.open?'미결':'확정');
    chip.style.flex='0 0 auto';
    chip.addEventListener('click', ()=>{
      d.open = !d.open;
      if (!d.open) d.date = (new Date().getMonth()+1) + '/' + new Date().getDate();
      persist(); render();
    });
    row.appendChild(chip);
    const txt = el('div','txt', d.text);
    editable(txt, ['decisions',i,'text']);
    row.appendChild(txt);
    const del = el('button','del','✕');
    del.title='삭제';
    del.addEventListener('click', ()=>{
      if (confirm('이 항목을 삭제할까요?\n"' + d.text + '"')){
        state.decisions.splice(i,1);
        persist(); render();
      }
    });
    row.appendChild(del);
    card.appendChild(row);
  });
  const add = el('div','add-row');
  const inp = el('input');
  inp.placeholder = '새 결정/미결 사항 입력 후 Enter';
  const btn = el('button','','추가');
  const doAdd = ()=>{
    const v = inp.value.trim();
    if (!v) return;
    state.decisions.push({ date:'미결', text:v, open:true });
    persist(); render();
  };
  inp.addEventListener('keydown', e=>{ if (e.key==='Enter') doAdd(); });
  btn.addEventListener('click', doAdd);
  add.appendChild(inp); add.appendChild(btn);
  card.appendChild(add);
  sec.appendChild(card);
  return sec;
}

/* ====== 시작 ====== */
function startLocal(){
  const saved = localStorage.getItem(LOCAL_KEY);
  if (saved){
    try { state = mergeState(JSON.parse(saved)); } catch(e){ /* 손상 시 기본값 */ }
  }
  render();
}

function startShared(){
  const scripts = [
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js'
  ];
  let loaded = 0;
  scripts.forEach(src=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>{
      loaded++;
      if (loaded === scripts.length){
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        const banner = document.getElementById('mode-banner');
        banner.className = 'shared';
        banner.textContent = '🟢 공유 모드 — 수정하면 모두의 화면에 반영됩니다';
        db.ref(DB_PATH).on('value', snap=>{
          const val = snap.val();
          if (val) state = mergeState(val);
          else db.ref(DB_PATH).set(state);
          render();
        });
      }
    };
    s.onerror = ()=>{ startLocal(); };
    document.head.appendChild(s);
  });
}

if (firebaseConfig) startShared();
else startLocal();
</script>
