<title>독서모임이 이야기하는 독서모임 — 운영 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Pretendard:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#2b2620; --sub:#7a7167;
    --accent:#c0563b; --accent-soft:#f6e3dc; --green:#3e7a4e; --green-soft:#e2efe5;
    --amber:#b07d2b; --amber-soft:#f5ecd9; --line:#e8e0d4; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,sans-serif;line-height:1.6;padding-bottom:120px}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  h1,h2{font-family:'Noto Serif KR',serif}

  #mode-banner{font-size:13px;text-align:center;padding:8px 12px;background:var(--amber-soft);color:var(--amber)}
  #mode-banner.shared{background:var(--green-soft);color:var(--green)}

  /* hero */
  .hero{padding:44px 0 28px;text-align:center}
  .hero .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin-bottom:10px}
  .hero h1{font-size:clamp(26px,5.5vw,40px);font-weight:900;line-height:1.3}
  .hero .dday{display:inline-block;margin-top:16px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 22px;font-size:18px;font-weight:600}
  .info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:24px}
  .info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;text-align:center}
  .info-card .k{font-size:12px;color:var(--sub)}
  .info-card .v{font-size:15px;font-weight:600;margin-top:2px}

  section{margin-top:36px}
  section>h2{font-size:21px;font-weight:900;margin-bottom:4px}
  section>.desc{font-size:13px;color:var(--sub);margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

  /* timeline */
  .tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .tl-item:last-child{border-bottom:none}
  .tl-time{flex:0 0 92px;font-weight:600;font-size:14px;color:var(--accent);padding-top:2px}
  .tl-body{flex:1}
  .tl-body .t{font-weight:600;font-size:15px}
  .tl-body .d{font-size:13px;color:var(--sub)}
  .tl-len{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
  .tl-main{border-left:3px solid var(--accent);padding-left:11px;margin-left:-14px}

  /* contents cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .ct-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative}
  .ct-card h3{font-size:16px;margin-bottom:6px}
  .ct-row{font-size:13px;margin-top:4px;display:flex;gap:6px}
  .ct-row .k{color:var(--sub);flex:0 0 44px;padding-top:2px}
  .ct-row .v{flex:1}
  .chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 12px;user-select:none}
  .chip.s0{background:var(--amber-soft);color:var(--amber)}
  .chip.s1{background:var(--accent-soft);color:var(--accent)}
  .chip.s2{background:var(--green-soft);color:var(--green)}
  .chip.clickable{cursor:pointer;box-shadow:0 0 0 1.5px currentColor inset}

  /* checklist */
  .chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .chk:last-child{border-bottom:none}
  .chk .box{flex:0 0 20px;height:20px;border:2px solid var(--line);border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}
  .chk.done .box{background:var(--green);border-color:var(--green)}
  .chk.done .txt{color:var(--sub);text-decoration:line-through}
  .chk .due{flex:0 0 78px;font-size:12px;font-weight:600;color:var(--accent);margin-top:4px}
  .chk .txt{font-size:14px;flex:1}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--sub);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .total td{font-weight:700;border-top:2px solid var(--line)}
  .bep{font-size:12px;border-radius:6px;padding:1px 7px;white-space:nowrap}
  .bep.ok{background:var(--green-soft);color:var(--green)}
  .bep.warn{background:var(--amber-soft);color:var(--amber)}

  /* recruit */
  .bar{height:18px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 6px;position:relative}
  .bar .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .bar .bep-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .recruit-nums{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);flex-wrap:wrap;gap:4px}
  .recruit-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
  .recruit-edit label{font-size:12px;color:var(--sub);display:block}

  /* decisions */
  .dec{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
  .dec:last-child{border-bottom:none}
  .dec .txt{flex:1;font-size:14px}
  .dec .date{font-size:12px;color:var(--sub);flex:0 0 52px;margin-top:3px}

  ul.plain{list-style:none}
  ul.plain li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;gap:8px;align-items:flex-start}
  ul.plain li:before{content:"📚";flex:0 0 auto}
  ul.plain li:last-child{border-bottom:none}
  ul.plain li .v{flex:1}

  /* ===== edit mode ===== */
  body.editing{background:#f6efe2}
  body.editing section>h2:after{content:" ✏️";font-size:15px}
  .e-in{font:inherit;font-size:14px;width:100%;border:1.5px solid #d8c9a8;border-radius:8px;padding:6px 9px;background:#fff;color:var(--ink)}
  .e-in:focus{outline:none;border-color:var(--accent)}
  .e-in.sm{width:84px}
  .e-in.num{text-align:right}
  .e-row-tools{display:flex;gap:6px;flex:0 0 auto;align-items:center}
  .tool-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-size:13px;cursor:pointer;color:var(--sub)}
  .tool-btn.del{color:#b3402a}
  .add-btn{display:block;width:100%;margin-top:12px;border:1.5px dashed #cdbd9a;background:none;border-radius:10px;padding:9px;font-size:14px;color:var(--sub);cursor:pointer;font-family:inherit}
  .add-btn:hover{border-color:var(--accent);color:var(--accent)}
  .e-stack{display:flex;flex-direction:column;gap:6px;flex:1}
  .e-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .e-label{font-size:11px;color:var(--sub);flex:0 0 auto}
  .main-toggle{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);white-space:nowrap;cursor:pointer}

  /* floating action bar */
  #fab{position:fixed;right:16px;bottom:16px;display:flex;gap:10px;z-index:50}
  #fab button{border:none;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(43,38,32,.25)}
  #fab .edit-btn{background:var(--ink);color:#fff}
  #fab .save-btn{background:var(--green);color:#fff}
  #fab .cancel-btn{background:#fff;color:var(--sub)}
  #edit-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:#fff;font-size:12px;border-radius:999px;padding:6px 16px;opacity:.92;z-index:50;white-space:nowrap}

  footer{text-align:center;font-size:12px;color:var(--sub);margin-top:48px}
  @media (max-width:480px){
    .tl-time{flex-basis:74px;font-size:13px}
    .chk .due{flex-basis:64px}
    #fab{right:12px;bottom:12px}
  }
</style>

/* ====== 상태 ======
   state = 모두에게 공유된 현재 내용
   draft = 수정 모드에서 작업 중인 복사본 (저장 전까지 나한테만 보임) */
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let draft = null;
let db = null;

const editing = () => draft !== null;
const cur = () => draft || state;

function persist(){
  if (db) db.ref(DB_PATH).set(state);
  else { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }
}

function mergeState(saved){
  if (!saved) return JSON.parse(JSON.stringify(DEFAULT_STATE));
  const out = JSON.parse(JSON.stringify(DEFAULT_STATE));
  for (const k of Object.keys(saved)) out[k] = saved[k];
  return out;
}

function startEdit(){
  draft = JSON.parse(JSON.stringify(state));
  document.body.classList.add('editing');
  render();
}
function saveEdit(){
  state = draft; draft = null;
  document.body.classList.remove('editing');
  persist(); render();
}
function cancelEdit(){
  if (!confirm('수정한 내용을 저장하지 않고 취소할까요?')) return;
  draft = null;
  document.body.classList.remove('editing');
  render();
}

/* ====== 헬퍼 ====== */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function won(n){ return (n||0).toLocaleString('ko-KR') + '원'; }

/* 수정 모드 입력칸: obj[key]에 바로 연결 */
function inp(obj, key, opts={}){
  const i = document.createElement('input');
  i.className = 'e-in' + (opts.sm?' sm':'') + (opts.number?' num':'');
  i.value = obj[key] ?? '';
  if (opts.placeholder) i.placeholder = opts.placeholder;
  i.addEventListener('input', ()=>{
    let v = i.value;
    if (opts.number){ v = parseInt(String(v).replace(/[^0-9]/g,''),10) || 0; }
    obj[key] = v;
  });
  if (opts.number) i.addEventListener('blur', ()=>{ i.value = obj[key]; });
  return i;
}
function delBtn(arr, i, label){
  const b = el('button','tool-btn del','✕');
  b.title = '삭제';
  b.addEventListener('click', ()=>{
    if (confirm((label||'이 항목') + '을(를) 삭제할까요?')){ arr.splice(i,1); render(); }
  });
  return b;
}
function upBtn(arr, i){
  const b = el('button','tool-btn','↑');
  b.title = '위로';
  b.disabled = i===0;
  b.addEventListener('click', ()=>{
    if (i===0) return;
    [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
    render();
  });
  return b;
}
function addBtn(text, fn){
  const b = el('button','add-btn', '＋ ' + text);
  b.addEventListener('click', ()=>{ fn(); render(); });
  return b;
}

/* ====== 렌더 ====== */
function render(){
  const app = document.getElementById('app');
  app.textContent = '';
  app.appendChild(renderHero());
  app.appendChild(renderTimeline());
  app.appendChild(renderContents());
  app.appendChild(renderRoadmap());
  app.appendChild(renderBudget());
  app.appendChild(renderRoles());
  app.appendChild(renderFlea());
  app.appendChild(renderRecruit());
  app.appendChild(renderDecisions());
  renderFab();
}

function checkRow(item, arr, i, withDue, label){
  const row = el('div','chk' + (item.done?' done':''));

    item.done = !item.done;

    render();
  });
  row.appendChild(box);
  if (editing()){
    if (withDue){
      const due = inp(item,'due',{sm:true}); due.placeholder='기한';
      row.appendChild(due);
    }
    const t = inp(item, withDue?'task':'text'); t.style.flex='1';
    row.appendChild(t);
    const tools = el('div','e-row-tools');
    tools.appendChild(delBtn(arr,i,label));
    row.appendChild(tools);
  } else {
    if (withDue) row.appendChild(el('div','due', item.due));
    row.appendChild(el('div','txt', item.task || item.text));
  }
  return row;
}

      row.appendChild(el('div','txt', d.text));
    }
    card.appendChild(row);
  });
  if (editing()) card.appendChild(addBtn('결정/미결 사항 추가', ()=> s.decisions.push({date:'미결', text:'', open:true})));
  sec.appendChild(card);
  return sec;
}

/* ====== 시작 ====== */
function startLocal(){
  const saved = localStorage.getItem(LOCAL_KEY);
  if (saved){
    try { state = mergeState(JSON.parse(saved)); } catch(e){ /* 손상 시 기본값 */ }
  }
  render();
}

function startShared(){
  const scripts = [
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js'
  ];
  let loaded = 0;
  scripts.forEach(src=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>{
      loaded++;
      if (loaded === scripts.length){
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        const banner = document.getElementById('mode-banner');
        banner.className = 'shared';
        banner.textContent = '🟢 공유 모드 — 저장하면 모두의 화면에 반영됩니다';
        db.ref(DB_PATH).on('value', snap=>{
          const val = snap.val();
          if (val) state = mergeState(val);
          else db.ref(DB_PATH).set(state);
          /* 수정 모드 중엔 화면을 덮어쓰지 않음 (내 작업 보호, 저장 시 내 내용이 반영됨) */
          if (!editing()) render();
        });
      }
    };
    s.onerror = ()=>{ startLocal(); };
    document.head.appendChild(s);
  });
}

if (firebaseConfig) startShared();
else startLocal();
</script>
